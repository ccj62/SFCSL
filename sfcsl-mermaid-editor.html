<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFCSL Mermaid-editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: styring øverst, kode ved siden af kode, diagram i fuld bredde under. */
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --fg: #1b2330; --muted: #5b6678; --line: #d9dee6;
    --accent: #0b6e8a; --accent-fg: #ffffff; --accent-soft: #e1f0f4;
    --code-bg: #eef1f5; --ok: #1d7a46; --warn: #9a5b00; --err: #b3261e;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171f; --panel: #1a212b; --fg: #e6ebf2; --muted: #9aa6b8; --line: #2c3644;
      --accent: #5cc3dd; --accent-fg: #0c1a20; --accent-soft: #1b3440;
      --code-bg: #222b37; --ok: #5ecb8a; --warn: #e0a64a; --err: #ff8a80; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171f; --panel: #1a212b; --fg: #e6ebf2; --muted: #9aa6b8; --line: #2c3644;
    --accent: #5cc3dd; --accent-fg: #0c1a20; --accent-soft: #1b3440;
    --code-bg: #222b37; --ok: #5ecb8a; --warn: #e0a64a; --err: #ff8a80; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5;
         padding-inline: 16px; padding-block: 24px 48px; }
  main { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.15; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 0.74rem; margin: 0; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  p { margin: 0; max-width: 70ch; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; background: var(--panel);
         border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  label, .lbl { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
  select, button, textarea { font: inherit; color: var(--fg); }
  select { background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; max-width: 100%; }
  .check { display: flex; align-items: center; gap: 8px; padding-bottom: 7px; }
  .check label { color: var(--fg); font-size: 0.92rem; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { min-height: 1.5em; font-size: 0.9rem; }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); } .status.warn { color: var(--warn); }
  .status ul { margin: 4px 0 0; padding-left: 1.2em; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .cardhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  textarea, .out { font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.5; background: var(--code-bg);
        border: 1px solid var(--line); border-radius: 4px; padding: 12px; width: 100%; min-height: 340px; resize: vertical; white-space: pre; overflow: auto; tab-size: 2; }
  .out.stale { opacity: 0.55; }
  .diagram { overflow-x: auto; display: flex; justify-content: center; min-height: 120px; }
  .diagram.left { justify-content: flex-start; }
  .diagram svg { max-width: 100%; height: auto; }
  .hint { font-size: 0.85rem; color: var(--muted); }
  @media (max-width: 760px) { .pair { grid-template-columns: minmax(0, 1fr); } textarea, .out { min-height: 240px; } }
</style>
</head>
<body>
<main>
  <header style="display:flex;flex-direction:column;gap:8px">
    <h1>SFCSL Mermaid-editor</h1>
    <p>Skriv eller indsæt et SFCSL-program. Mermaid-koden dannes ud fra det, og diagrammet tegnes under. Koden kan kopieres ind i et dokument, en wiki eller en pull request.</p>
  </header>

  <div class="bar" role="group" aria-label="Indstillinger">
    <div class="field">
      <label for="ex">Eksempel</label>
      <select id="ex"></select>
    </div>
    <div class="field">
      <label for="style">Stil</label>
      <select id="style">
        <option value="state">Tilstandsdiagram</option>
        <option value="flow">Flowchart</option>
      </select>
    </div>
    <div class="field">
      <label for="theme">Farver</label>
      <select id="theme">
        <option value="default">Standard</option>
        <option value="neutral">Neutral</option>
        <option value="forest">Skov</option>
        <option value="base">Dæmpet blå</option>
      </select>
    </div>
    <div class="field">
      <label for="space">Afstand</label>
      <select id="space">
        <option value="tight">Kompakt</option>
        <option value="normal">Normal</option>
        <option value="loose">Luftig</option>
      </select>
    </div>
    <div class="field">
      <label for="align">Diagrammet</label>
      <select id="align">
        <option value="">Centreret</option>
        <option value="left">Venstrestillet</option>
      </select>
    </div>
    <div class="check">
      <input type="checkbox" id="prio" checked>
      <label for="prio">Vis prioritet</label>
    </div>
    <div class="check">
      <input type="checkbox" id="auto" checked>
      <label for="auto">Opdater automatisk</label>
    </div>
    <button id="go" class="primary" type="button">Generér</button>
  </div>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <div class="pair">
    <section class="card" aria-labelledby="h-src">
      <div class="cardhead"><h2 id="h-src">SFCSL</h2><button id="copysrc" type="button">Kopiér</button></div>
      <textarea id="src" spellcheck="false" aria-labelledby="h-src"></textarea>
    </section>
    <section class="card" aria-labelledby="h-out">
      <div class="cardhead"><h2 id="h-out">Mermaid-kode</h2><button id="copy" type="button">Kopiér</button></div>
      <textarea id="out" class="out" spellcheck="false" readonly aria-labelledby="h-out"></textarea>
      <p class="hint" id="outhint">Låst, mens "Opdater automatisk" er slået til.</p>
    </section>
  </div>

  <section class="card" aria-labelledby="h-dia">
    <div class="cardhead"><h2 id="h-dia">Diagram</h2></div>
    <div id="dia" class="diagram"></div>
    <p class="hint" id="diahint"></p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.4.0/mermaid.min.js"></script>
<script>
// SFCSL: tokenizer, parser, validering og oversættelse til Mermaid stateDiagram.
// Spejler sfcsl.py (parse, validate, to_mermaid_state).
const TOK = /\/\/[^\n]*|S(?:0|[1-9]\d*)(?!\d)|t(?:0|[1-9]\d*)(?!\d)|>>|[()\[\]]|\s+/y;

function tokenize(text) {
  const toks = [];
  let pos = 0;
  while (pos < text.length) {
    TOK.lastIndex = pos;
    const m = TOK.exec(text);
    if (!m) throw new Error('Ulovligt tegn: ' + JSON.stringify(text.slice(pos, pos + 12)));
    pos = TOK.lastIndex;
    const s = m[0];
    if (/^\s+$/.test(s) || s.startsWith('//')) continue;
    toks.push(s);
  }
  return toks;
}

function kind(t) {
  if (t === null || t === undefined) return null;
  if (/^S(?:0|[1-9]\d*)$/.test(t)) return 'S';
  if (/^t(?:0|[1-9]\d*)$/.test(t)) return 'T';
  return t;
}

class Parser {
  constructor(toks) { this.t = toks; this.i = 0; }
  pk(k = 0) { const j = this.i + k; return j < this.t.length ? this.t[j] : null; }
  nx() { const t = this.pk(); this.i++; return t; }
  closerS() { return kind(this.pk()) === 'S' && this.pk(1) === ')'; }
  closerT() { return kind(this.pk()) === 'T' && this.pk(1) === ']'; }
  chain(first) {
    const items = [];
    let expect = first;
    for (;;) {
      const k = kind(this.pk());
      if (k === null) break;
      if (expect === 'S') {
        if (k !== 'S' || this.closerS()) break;
        items.push(['S', this.nx()]);
        expect = 'T';
        while (this.pk() === '(') items.push(this.alt());
      } else {
        if (k !== 'T' || this.closerT()) break;
        items.push(['T', this.nx()]);
        expect = 'S';
        while (this.pk() === '[') items.push(this.par());
        if (this.pk() === '>>') {
          this.nx();
          const tgt = this.nx();
          if (kind(tgt) !== 'S') throw new Error('Et hop skal pege på et trin');
          items.push(['JUMP', tgt]);
          break;
        }
      }
    }
    return items;
  }
  alt() {
    this.nx();
    const brs = [];
    let c;
    for (;;) {
      if (this.closerS()) { c = this.nx(); this.nx(); break; }
      if (kind(this.pk()) !== 'T') throw new Error('En alt-gren skal starte med en transition, fandt ' + this.pk());
      const b = this.chain('T');
      if (!b.length) throw new Error('Uventet lukning i en alt-gren');
      brs.push(b);
    }
    if (brs.length < 2) throw new Error('En alt-blok skal have mindst to grene');
    return ['ALT', brs, c];
  }
  par() {
    this.nx();
    const brs = [];
    let c;
    for (;;) {
      if (this.closerT()) { c = this.nx(); this.nx(); break; }
      if (kind(this.pk()) !== 'S') throw new Error('En par-gren skal starte med et trin, fandt ' + this.pk());
      const b = this.chain('S');
      if (!b.length) throw new Error('Uventet lukning i en par-gren');
      brs.push(b);
    }
    if (brs.length < 2) throw new Error('En par-blok skal have mindst to grene');
    return ['PAR', brs, c];
  }
}

const END = { S: 'S', T: 'T', JUMP: 'J', ALT: 'S', PAR: 'T' };
function endkind(items) { return END[items[items.length - 1][0]]; }

function checkEnds(items, ctx) {
  const e = endkind(items);
  if (ctx === 'main' && e !== 'S') throw new Error('Hovedkæden skal slutte med et trin (sluttrinnet)');
  if (ctx === 'par' && e !== 'S') throw new Error('En par-gren skal slutte med et trin');
  if (ctx === 'alt' && e !== 'T' && e !== 'J') throw new Error('En alt-gren skal slutte med en transition eller et hop');
  for (const it of items) {
    if (it[0] === 'ALT') for (const b of it[1]) checkEnds(b, 'alt');
    else if (it[0] === 'PAR') for (const b of it[1]) checkEnds(b, 'par');
  }
}

function parse(text) {
  const p = new Parser(tokenize(text));
  if (kind(p.pk()) !== 'S') throw new Error('Sekvensen skal starte med et trin');
  const items = p.chain('S');
  if (p.pk() !== null) throw new Error('Uventet ' + p.pk());
  checkEnds(items, 'main');
  return items;
}

function validate(items) {
  const errs = [], defs = {}, seen = new Set(), jumps = [];
  let counter = 0;
  function walk(chain, scope) {
    let lastT = null;
    for (const it of chain) {
      const k = it[0];
      if (k === 'S' || k === 'T') {
        const id = it[1];
        if (seen.has(id)) errs.push(`${id} er defineret mere end én gang`);
        seen.add(id);
        defs[id] = scope;
        if (k === 'T') lastT = id;
      } else if (k === 'JUMP') {
        jumps.push([lastT, it[1], scope]);
      } else {
        for (const b of it[1]) {
          if (k === 'PAR') {
            counter++;
            walk(b, scope + '/' + counter);
            const tail = b[b.length - 1];
            if (tail[0] === 'ALT' && tail[1].every(x => endkind(x) === 'J'))
              errs.push(`Alt-blokken, der lukkes af ${tail[2]}, står sidst i en par-gren, men ingen af dens grene når lukkeren`);
          } else walk(b, scope);
        }
        const cid = it[2];
        if (seen.has(cid)) errs.push(`${cid} er defineret mere end én gang`);
        seen.add(cid);
        defs[cid] = scope;
        if (k === 'PAR') lastT = cid;
      }
    }
  }
  walk(items, '');
  for (const [src, tgt, scope] of jumps) {
    if (!(tgt in defs)) errs.push(`Hop ${src} >> ${tgt}: målet findes ikke`);
    else if (defs[tgt] !== scope) errs.push(`Hop ${src} >> ${tgt}: går ind i eller ud af en par-gren`);
  }
  return errs;
}

function toMermaidState(items, direction, prio) {
  const edges = [], decl = [];
  let nf = 0, nj = 0;
  const edge = (a, b, lab) => edges.push(`    ${a} --> ${b}` + (lab ? `: ${lab}` : ''));
  function link(chain, cur, pr) {
    cur = cur.slice();
    for (const [pos, it] of chain.entries()) {
      const k = it[0];
      if (k === 'S') {
        for (const [src, lab] of cur) edge(src, it[1], lab);
        cur = [[it[1], null]];
      } else if (k === 'T') {
        const name = it[1] + (pr && pos === 0 ? ' ' + pr : '');
        cur = cur.map(([src]) => [src, name]);
      } else if (k === 'JUMP') {
        for (const [src, lab] of cur) edge(src, it[1], lab);
        cur = [];
      } else if (k === 'ALT') {
        let exits = [];
        for (const [n, b] of it[1].entries()) exits = exits.concat(link(b, cur, prio ? String(n + 1) : null));
        for (const [src, lab] of exits) edge(src, it[2], lab);
        cur = [[it[2], null]];
      } else {
        const f = 'F' + (++nf);
        decl.push(`    state ${f} <<fork>>`);
        for (const [src, lab] of cur) edge(src, f, lab);
        let exits = [];
        for (const b of it[1]) exits = exits.concat(link(b, [[f, null]]));
        const j = 'J' + (++nj);
        decl.push(`    state ${j} <<join>>`);
        for (const [src] of exits) edge(src, j, null);
        cur = [[j, it[2]]];
      }
    }
    return cur;
  }
  const first = items[0][1];
  const last = link(items, []);
  const out = ['stateDiagram-v2'];
  if (direction) out.push(`    direction ${direction}`);
  out.push(...decl);
  out.push(`    [*] --> ${first}`);
  out.push(...edges);
  for (const [src] of last) out.push(`    ${src} --> [*]`);
  return out.join('\n');
}

const BAR = '#nbsp;'.repeat(14);

function toMermaidFlow(items, direction, prio) {
  const nodes = [], edges = [], jumps = [], seen = new Set();
  let nb = 0, first = true;
  function node(id, kd) {
    if (seen.has(id)) return;
    seen.add(id);
    if (kd === 'S') { nodes.push(first ? `    ${id}[["${id}"]]` : `    ${id}["${id}"]`); first = false; }
    else nodes.push(`    ${id}(["${id}"])`);
  }
  function bar() { const b = 'B' + (++nb); nodes.push(`    ${b}["${BAR}"]:::bar`); return b; }
  function link(chain, incoming, pr) {
    let cur = incoming.slice();
    for (const [pos, it] of chain.entries()) {
      const k = it[0];
      if (k === 'S' || k === 'T') {
        node(it[1], k);
        for (const c of cur) edges.push([c, it[1], '-->', pos === 0 ? pr : null]);
        cur = [it[1]];
      } else if (k === 'JUMP') {
        jumps.push([cur, it[1]]);
        cur = [];
      } else if (k === 'ALT') {
        let exits = [];
        for (const [n, b] of it[1].entries()) exits = exits.concat(link(b, cur, prio ? String(n + 1) : null));
        node(it[2], 'S');
        for (const e of exits) edges.push([e, it[2], '-->', null]);
        cur = [it[2]];
      } else {
        const f = bar();
        for (const c of cur) edges.push([c, f, '-->', pos === 0 ? pr : null]);
        let exits = [];
        for (const b of it[1]) exits = exits.concat(link(b, [f]));
        const j = bar();
        for (const e of exits) edges.push([e, j, '-->', null]);
        node(it[2], 'T');
        edges.push([j, it[2], '-->', null]);
        cur = [it[2]];
      }
    }
    return cur;
  }
  link(items, []);
  for (const [srcs, tgt] of jumps) for (const c of srcs) edges.push([c, tgt, '-.->', null]);
  const out = [`flowchart ${direction || 'TD'}`, ...nodes, ...edges.map(([a, b, ar, lab]) => lab ? `    ${a} ${ar}|${lab}| ${b}` : `    ${a} ${ar} ${b}`),
    '    classDef bar fill:#7b8798,stroke:#7b8798,color:#7b8798;'];
  return out.join('\n');
}

function sfcslToMermaid(text, direction, style, prio) {
  const items = parse(text);
  const errors = validate(items);
  return { code: style === 'flow' ? toMermaidFlow(items, direction, prio) : toMermaidState(items, direction, prio), errors };
}

if (typeof module !== 'undefined') module.exports = { tokenize, parse, validate, toMermaidState, toMermaidFlow, sfcslToMermaid };

const EXAMPLES = [{"name": "Hurtig start", "src": "S1 t2 S2 t3 S3(\n  t4 S4 t5\n  t6 S5 t7\n  S6) t8[\n    S7 t9 S8\n    S9\n    t10]\nS99"}, {"name": "Hop tilbage", "src": "S1 t2 S2 t3 S3(\n  t4 S4 t5\n  t6 >> S2\n  t7\n  S5) t8[\n    S7 t9 S8\n    S9\n    t10]\nS99"}, {"name": "Prioritet og afbrydelse", "src": "S1 t2 S2 t3 S3(\n  t20 >> S99\n  t4 S4 t5\n  t6 >> S2\n  S5) t8\nS99"}, {"name": "Parallelle blokke i kæde", "src": "S1 t2[\n  S2 t3 S3\n  S4\n  t4][\n    S5 t5 S6\n    S7\n    t6]\nS99"}, {"name": "Det store eksempel", "src": "S1 t2 S2 t3 S3(\n  t4[\n    S4 t5 S5\n    S6 t6 S7\n    t7] S8 t8 S9(\n      t9 S10 t10\n      t11 >> S8\n      S11) t12 S12 t13\n  t14 S13 t15\n  t16 >> S2\n  S14) t17\nS99"}, {"name": "To alt-blokke og løkke i par", "src": "S1 t9 S2 t2 S3(\n  t3 S4 t4\n  t5 >> S2\n  t6 S5 t7\n  t8 >> S99\n  S9)(\n    t10 S10 t11\n    t12\n    S13) t13[\n      S20 t14 S21(\n        t15 S22 t16 >> S21\n        t17\n        S23)\n      S30\n      t20]\nS99"}];

const $ = id => document.getElementById(id);
const src = $('src'), out = $('out'), dia = $('dia'), statusEl = $('status'), auto = $('auto'), go = $('go');
let renderSeq = 0, timer = null;

for (const [i, e] of EXAMPLES.entries()) {
  const o = document.createElement('option');
  o.value = i; o.textContent = e.name; $('ex').appendChild(o);
}
src.value = EXAMPLES[0].src;

function dark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function setStatus(cls, html) { statusEl.className = 'status ' + cls; statusEl.innerHTML = html; }
function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

async function draw(code) {
  const seq = ++renderSeq;
  const hint = $('diahint');
  if (!window.mermaid) {
    hint.textContent = 'Mermaid kunne ikke indlæses her, så diagrammet kan ikke tegnes. Koden til højre kan indsættes i et dokument.';
    return;
  }
  try {
    const SP = { tight: [16, 20, 4, '13px'], normal: [30, 40, 8, '15px'], loose: [50, 65, 12, '16px'] }[$('space').value];
    const sp = { nodeSpacing: SP[0], rankSpacing: SP[1], padding: SP[2] };
    let theme = $('theme').value;
    const vars = { fontSize: SP[3] };
    if (dark()) theme = 'dark';
    else if (theme === 'base') Object.assign(vars, {
      primaryColor: '#e1f0f4', primaryBorderColor: '#0b6e8a', primaryTextColor: '#1b2330',
      lineColor: '#4a5568', secondaryColor: '#f5f6f8', tertiaryColor: '#ffffff', edgeLabelBackground: '#ffffff' });
    mermaid.initialize({ startOnLoad: false, theme, securityLevel: 'strict',
      themeVariables: vars, state: sp, stateDiagram: sp, flowchart: sp });
    const { svg } = await mermaid.render('sfcsl-d' + seq, code);
    if (seq !== renderSeq) return;
    dia.innerHTML = svg;
    hint.textContent = '';
  } catch (e) {
    if (seq !== renderSeq) return;
    hint.textContent = 'Mermaid kunne ikke tegne diagrammet: ' + (e && e.message ? e.message : e);
  } finally {
    cleanup();
  }
}

// Mermaid efterlader et midlertidigt element (med fejl-grafik) i siden, når tegningen mislykkes.
function cleanup() {
  document.querySelectorAll('[id^="dsfcsl-d"], [id^="sfcsl-d"], [id^="isfcsl-d"]').forEach(el => {
    if (!dia.contains(el)) el.remove();
  });
}

function generate() {
  const text = src.value;
  if (!text.trim()) { setStatus('warn', 'Skriv et SFCSL-program.'); return; }
  let res;
  try {
    res = sfcslToMermaid(text, null, $('style').value, $('prio').checked);
  } catch (e) {
    out.classList.add('stale');
    setStatus('err', esc(e.message) + '. Mermaid-koden viser det sidste gyldige program.');
    return;
  }
  out.classList.remove('stale');
  out.value = res.code;
  const n = (text.match(/\b[St]\d+\b/g) || []).length;
  if (res.errors.length) {
    setStatus('warn', 'Programmet kan læses, men bryder reglerne i afsnit 7.2:<ul>' + res.errors.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul>');
  } else {
    setStatus('ok', 'Gyldigt program med ' + n + ' trin og transitioner.');
  }
  draw(res.code);
}

function lockOut() {
  out.readOnly = auto.checked;
  $('outhint').textContent = auto.checked
    ? 'Låst, mens "Opdater automatisk" er slået til.'
    : 'Kan redigeres. Diagrammet tegnes efter din kode, men Generér overskriver den med kode fra SFCSL.';
}

function schedule() {
  if (!auto.checked) { setStatus('warn', 'Programmet er ændret. Tryk på Generér for at opdatere.'); return; }
  clearTimeout(timer);
  timer = setTimeout(generate, 250);
}

src.addEventListener('input', schedule);
for (const id of ['style', 'theme', 'space']) $(id).addEventListener('change', () => { if (id === 'style') generate(); else draw(out.value); });
$('prio').addEventListener('change', generate);
$('align').addEventListener('change', () => dia.classList.toggle('left', $('align').value === 'left'));
out.addEventListener('input', () => {
  if (out.readOnly) return;
  setStatus('warn', 'Mermaid-koden er redigeret direkte og passer ikke nødvendigvis til SFCSL-programmet. Generér overskriver den.');
  clearTimeout(timer);
  timer = setTimeout(() => draw(out.value), 250);
});
go.addEventListener('click', generate);
auto.addEventListener('change', () => { lockOut(); if (auto.checked) generate(); });
$('ex').addEventListener('change', () => { src.value = EXAMPLES[+$('ex').value].src; generate(); });
function wireCopy(btnId, area) {
  const b = $(btnId);
  b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(area.value); b.textContent = 'Kopieret'; }
    catch (e) { area.focus(); area.select(); b.textContent = 'Markeret'; }
    setTimeout(() => { b.textContent = 'Kopiér'; }, 1500);
  });
}
wireCopy('copy', out);
wireCopy('copysrc', src);
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (out.value) draw(out.value); });

lockOut();
generate();
</script>
</body>
</html>
